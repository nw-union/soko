name: PR
on: [pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 自動生成系コードをコミットする
  check:
    uses: nw-union/.github/.github/workflows/auto_update_with_bun.yml@main
    secrets: inherit
    with:
      commands: '["fmt"]'

  # コードの静的解析
  analysis:
    uses: nw-union/.github/.github/workflows/code_analysis.yml@main
    needs: check
    secrets: inherit

  # PR の設定確認
  chores:
    uses: nw-union/.github/.github/workflows/pr_chores.yml@main
    secrets: inherit

  # 型チェックとテスト
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx void prepare # .void/ の型を生成する（tsconfig.json が extends している）
      - run: bun run typecheck
      - run: bun test

  # ビルド
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
